<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSAR - QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a5f2a 0%, #2d8a3e 50%, #1a5f2a 100%);
            background-size: 400% 400%;
            animation: gradientMove 8s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 12s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 18s; }
        .particle:nth-child(3) { left: 35%; animation-delay: 4s; animation-duration: 14s; }
        .particle:nth-child(4) { left: 50%; animation-delay: 1s; animation-duration: 16s; }
        .particle:nth-child(5) { left: 65%; animation-delay: 3s; animation-duration: 13s; }
        .particle:nth-child(6) { left: 80%; animation-delay: 5s; animation-duration: 19s; }
        .particle:nth-child(7) { left: 90%; animation-delay: 2s; animation-duration: 15s; }
        .particle:nth-child(8) { left: 5%; animation-delay: 4s; animation-duration: 17s; }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            animation: fadeInUp 1.2s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 25px;
            border-radius: 50%;
            background: white;
            padding: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            }
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: slideInDown 1s ease-out 0.3s both;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-bottom: 35px;
            animation: slideInDown 1s ease-out 0.5s both;
        }

        .qr-wrapper {
            display: inline-block;
            padding: 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: bounceIn 1s ease-out 0.7s both;
            position: relative;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .qr-wrapper::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 25px;
            border: 3px solid rgba(255, 255, 255, 0.5);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #qrcode {
            display: inline-block;
        }

        #qrcode img {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
        }

        .scan-text {
            color: white;
            font-size: 1rem;
            margin-top: 25px;
            animation: fadeIn 1s ease-out 1.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .url-display {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            animation: fadeIn 1s ease-out 1.8s both;
        }

        .url-display:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: white;
            color: #1a5f2a;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-out 2.1s both;
        }

        .download-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .download-btn i {
            margin-right: 8px;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleEffect 3s ease-out infinite;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .footer {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            z-index: 2;
            animation: fadeIn 1s ease-out 2s both;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 0.95rem; }
            .logo { width: 80px; height: 80px; }
            .qr-wrapper { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <img src="/images/csar-logo.png" alt="CSAR Logo" class="logo" onerror="this.style.display='none'">
        <h1>CSAR</h1>
        <p class="subtitle">Commissariat à la Sécurité Alimentaire et à la Résilience</p>
        
        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>
        
        <p class="scan-text">Scannez ce QR code pour accéder directement au site</p>
        <a href="https://csar.sn/" class="url-display">https://csar.sn/</a>
        <br>
        <button type="button" class="download-btn" onclick="downloadQRCode()">
            <i class="fas fa-download"></i>Télécharger le QR code (PNG)
        </button>
    </div>

    <div class="footer">
        République du Sénégal - Ministère de la Famille, de l'Action Sociale et des Solidarités
    </div>

    <script>
        // Générer le QR code
        const qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "https://csar.sn/",
            width: 220,
            height: 220,
            colorDark : "#1a5f2a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Télécharger le QR code en PNG
        function downloadQRCode() {
            const img = document.querySelector('#qrcode img');
            if (!img) {
                alert('QR code non encore généré');
                return;
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 220;
            canvas.height = 220;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = 'csar-qr-code.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Effet ripple au clic
        document.addEventListener('click', function(e) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            document.body.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 3000);
        });
    </script>
</body>
</html>
