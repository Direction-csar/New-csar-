name: Tests CSAR

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, sqlite, pdo_sqlite, gd, zip, bcmath, intl
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php82-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php82-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Set directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run PHPUnit tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
        run: php artisan test --parallel || php artisan test

      - name: PHP syntax check (lint)
        run: |
          find app -name "*.php" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          find routes -name "*.php" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          find tests -name "*.php" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
